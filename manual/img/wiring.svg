<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="15">
  <title>高階款控制盒接線示意</title>
  <defs>
    <style>
      .box{fill:#fff;stroke:#1f2a29;stroke-width:2}
      .ctl{fill:#e3f2ef;stroke:#0f766e;stroke-width:2.5}
      .t{fill:#1f2a29}
      .m{fill:#5b6b69;font-size:13px}
      .h{font-weight:700;font-size:17px}
      .pin{fill:#0f766e;font-weight:700;font-size:14px}
      .hv{stroke:#c2410c;stroke-width:4;fill:none}
      .hvn{stroke:#1f2a29;stroke-width:4;fill:none}
      .v12{stroke:#ca8a04;stroke-width:2.5;fill:none}
      .sig{stroke:#2563eb;stroke-width:2.5;fill:none}
      .gnd{stroke:#5b6b69;stroke-width:2.5;fill:none;stroke-dasharray:6 4}
      .coil{stroke:#ca8a04;stroke-width:2.5;fill:none;stroke-dasharray:2 3}
    </style>
  </defs>

  <!-- 主電源 -->
  <rect class="box" x="20" y="60" width="170" height="150" rx="8"/>
  <text class="t h" x="105" y="92" text-anchor="middle">主電源</text>
  <text class="m" x="105" y="114" text-anchor="middle">直流輸出</text>
  <text class="m" x="105" y="132" text-anchor="middle">（DC 60–120 V）</text>
  <text class="pin" x="178" y="168" text-anchor="end">＋</text>
  <text class="pin" x="178" y="198" text-anchor="end">－</text>

  <!-- 接觸器 -->
  <rect class="box" x="360" y="40" width="150" height="190" rx="8"/>
  <text class="t h" x="435" y="66" text-anchor="middle">直流接觸器</text>
  <text class="m" x="435" y="86" text-anchor="middle">（繼電器）</text>
  <line x1="395" y1="160" x2="475" y2="150" stroke="#1f2a29" stroke-width="3"/>
  <circle cx="392" cy="160" r="4" fill="#1f2a29"/><circle cx="478" cy="160" r="4" fill="#1f2a29"/>
  <line x1="395" y1="196" x2="475" y2="186" stroke="#1f2a29" stroke-width="3"/>
  <circle cx="392" cy="196" r="4" fill="#1f2a29"/><circle cx="478" cy="196" r="4" fill="#1f2a29"/>
  <rect x="410" y="100" width="50" height="22" rx="3" fill="none" stroke="#ca8a04" stroke-width="2"/>
  <text class="m" x="435" y="116" text-anchor="middle">線圈</text>

  <!-- 充電槍 -->
  <rect class="box" x="690" y="40" width="190" height="400" rx="8"/>
  <text class="t h" x="785" y="70" text-anchor="middle">充電槍（TES）</text>
  <text class="pin" x="702" y="164">DC＋</text>
  <text class="pin" x="702" y="200">DC－</text>
  <text class="pin" x="702" y="262">槍鎖</text>
  <text class="pin" x="702" y="316">VP</text>
  <text class="pin" x="702" y="350">CAN-H／CAN-L</text>
  <text class="pin" x="702" y="384">CP</text>
  <text class="pin" x="702" y="418">GND</text>

  <!-- 高壓線 -->
  <path class="hv" d="M190 160 H392"/>
  <path class="hv" d="M478 160 H690"/>
  <path class="hvn" d="M190 196 H392"/>
  <path class="hvn" d="M478 196 H690"/>

  <!-- 控制盒 -->
  <rect class="ctl" x="120" y="300" width="420" height="270" rx="10"/>
  <text class="t h" x="330" y="558" text-anchor="middle">高階款控制盒（底部接頭排）</text>

  <!-- U10 -->
  <rect class="box" x="140" y="350" width="110" height="60" rx="5"/>
  <text class="pin" x="195" y="374" text-anchor="middle">U10</text>
  <text class="m" x="195" y="396" text-anchor="middle">＋ 120V ／ －</text>
  <path class="hv" d="M250 160 V250 H165 V350" />
  <path class="hvn" d="M290 196 V270 H225 V350" />
  <circle cx="250" cy="160" r="5" fill="#c2410c"/><circle cx="290" cy="196" r="5" fill="#1f2a29"/>
  <text class="m" x="140" y="430">供電＋量電壓</text>

  <!-- CN3/CN5 -->
  <rect class="box" x="275" y="350" width="120" height="60" rx="5"/>
  <text class="pin" x="335" y="374" text-anchor="middle">CN3 · CN5</text>
  <text class="m" x="335" y="396" text-anchor="middle">接觸器線圈 12V</text>
  <path class="coil" d="M335 350 V290 H435 V122"/>

  <!-- CN6 -->
  <rect class="box" x="410" y="350" width="110" height="60" rx="5"/>
  <text class="pin" x="465" y="374" text-anchor="middle">CN6</text>
  <text class="m" x="465" y="396" text-anchor="middle">槍鎖 12V</text>
  <path class="coil" d="M520 380 H600 V256 H690"/>

  <!-- CN1 -->
  <rect class="box" x="140" y="470" width="150" height="60" rx="5"/>
  <text class="pin" x="215" y="494" text-anchor="middle">CN1</text>
  <text class="m" x="215" y="516" text-anchor="middle">VP（12V）／ GND</text>
  <path class="v12" d="M215 470 V445 H620 V310 H690"/>

  <!-- CN2 -->
  <rect class="box" x="310" y="470" width="210" height="60" rx="5"/>
  <text class="pin" x="415" y="494" text-anchor="middle">CN2</text>
  <text class="m" x="415" y="516" text-anchor="middle">CANL · CANH · GND · CP</text>
  <path class="sig" d="M520 490 H640 V344 H690"/>
  <path class="sig" d="M520 505 H655 V378 H690"/>
  <path class="gnd" d="M520 520 H670 V412 H690"/>

  <!-- 圖例 -->
  <g transform="translate(20,585)" class="m">
    <line x1="0" y1="-5" x2="30" y2="-5" class="hv"/><text x="36" y="0">高壓直流＋</text>
    <line x1="130" y1="-5" x2="160" y2="-5" class="hvn"/><text x="166" y="0">高壓直流－</text>
    <line x1="260" y1="-5" x2="290" y2="-5" class="v12"/><text x="296" y="0">12 V</text>
    <line x1="350" y1="-5" x2="380" y2="-5" class="coil"/><text x="386" y="0">線圈驅動</text>
    <line x1="470" y1="-5" x2="500" y2="-5" class="sig"/><text x="506" y="0">訊號</text>
    <line x1="560" y1="-5" x2="590" y2="-5" class="gnd"/><text x="596" y="0">訊號地</text>
  </g>
  <text class="m" x="880" y="585" text-anchor="end">示意圖，不是施工圖</text>
</svg>
