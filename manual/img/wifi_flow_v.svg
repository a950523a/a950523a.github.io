<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 1320" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="15">
  <title>第一次連 WiFi 的流程</title>
  <defs>
    <style>
      .panel{fill:#fff;stroke:#dfe7e5;stroke-width:2}
      .n{fill:#0f766e}
      .nt{fill:#fff;font-weight:700;font-size:18px}
      .h{fill:#1f2a29;font-weight:700;font-size:17px}
      .t{fill:#1f2a29}
      .m{fill:#5b6b69;font-size:13px}
      .phone{fill:#1f2a29}
      .scr{fill:#f7faf9}
      .box{fill:#3a3d40}
      .mono{font-family:Consolas,monospace}
      .wave{fill:none;stroke:#0f766e;stroke-width:3;stroke-linecap:round}
      .arrow{fill:none;stroke:#0f766e;stroke-width:3;marker-end:url(#ah)}
      .hl{fill:#e3f2ef;stroke:#0f766e;stroke-width:1.5}
    </style>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/>
    </marker>
    <g id="ctl">
      <rect x="0" y="0" width="70" height="96" rx="8" class="box"/>
      <rect x="18" y="16" width="34" height="18" rx="2" fill="#0b0c0d"/>
      <circle cx="10" cy="20" r="3.5" fill="#f59e0b"/><circle cx="10" cy="30" r="3.5" fill="#22c55e"/>
      <rect x="10" y="80" width="50" height="10" rx="2" fill="#3fae49"/>
    </g>
    <g id="wifi">
      <path class="wave" d="M-14 -6 A20 20 0 0 1 14 -6"/>
      <path class="wave" d="M-24 -14 A34 34 0 0 1 24 -14"/>
      <circle cx="0" cy="2" r="3.5" fill="#0f766e"/>
    </g>
  </defs>

  <!-- 1 -->
  <g transform="translate(0,0)">
  <rect class="panel" x="10" y="10" width="430" height="310" rx="14"/>
  <circle class="n" cx="42" cy="42" r="18"/><text class="nt" x="42" y="49" text-anchor="middle">1</text>
  <text class="h" x="72" y="48">手機連上控制盒的熱點</text>
  <use href="#ctl" x="50" y="120"/>
  <use href="#wifi" x="85" y="105"/>
  <text class="m" x="85" y="240" text-anchor="middle">控制盒通電</text>
  <path class="arrow" d="M140 168 H200"/>
  <rect class="phone" x="215" y="70" width="150" height="235" rx="18"/>
  <rect class="scr" x="225" y="88" width="130" height="198" rx="6"/>
  <text class="t" x="235" y="112" font-weight="700" font-size="14">WiFi</text>
  <rect class="hl" x="229" y="124" width="122" height="44" rx="5"/>
  <text class="t mono" x="236" y="143" font-size="11.5">TES-Charger-</text>
  <text class="t mono" x="236" y="159" font-size="11.5">xxxxxx</text>
  <text class="m" x="236" y="190" font-size="11.5">MyHome</text>
  <text class="m" x="236" y="214" font-size="11.5">Neighbor</text>
  <text class="m" x="30" y="275">手機 WiFi 選</text>
  <text class="t mono" x="30" y="295" font-size="13">TES-Charger-xxxxxx</text>
  <text class="m" x="30" y="313">（第一次沒有密碼）</text>

  </g>
  <!-- 2 -->
  <g transform="translate(-450,330)">
  <rect class="panel" x="460" y="10" width="430" height="310" rx="14"/>
  <circle class="n" cx="492" cy="42" r="18"/><text class="nt" x="492" y="49" text-anchor="middle">2</text>
  <text class="h" x="522" y="48">打開網頁、加入家裡的 WiFi</text>
  <rect class="phone" x="520" y="70" width="150" height="235" rx="18"/>
  <rect class="scr" x="530" y="88" width="130" height="198" rx="6"/>
  <rect x="536" y="94" width="118" height="22" rx="11" fill="#fff" stroke="#dfe7e5"/>
  <text class="t mono" x="595" y="110" text-anchor="middle" font-size="12">192.168.4.1</text>
  <text class="t" x="538" y="138" font-size="12" font-weight="700">記住的 WiFi</text>
  <rect x="538" y="146" width="70" height="20" rx="4" fill="#fff" stroke="#c9d3d1"/>
  <text class="t" x="543" y="160" font-size="11">MyHome</text>
  <rect x="612" y="146" width="40" height="20" rx="4" fill="#e3f2ef" stroke="#0f766e"/>
  <text class="t" x="632" y="160" font-size="10.5" text-anchor="middle">掃描</text>
  <rect x="538" y="172" width="114" height="20" rx="4" fill="#fff" stroke="#c9d3d1"/>
  <text class="m" x="543" y="186" font-size="11">●●●●●●●●</text>
  <rect x="538" y="198" width="114" height="22" rx="4" fill="#0f766e"/>
  <text x="595" y="213" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">＋ 加入這組 WiFi</text>
  <text class="m" x="690" y="120">① 瀏覽器開</text>
  <text class="t mono" x="690" y="140" font-size="14">192.168.4.1</text>
  <text class="m" x="690" y="180">② 按「掃描」</text>
  <text class="m" x="690" y="198">選家裡的 WiFi</text>
  <text class="m" x="690" y="230">③ 輸入密碼</text>
  <text class="m" x="690" y="262">④ 按「加入這組</text>
  <text class="m" x="690" y="280">　 WiFi」</text>

  </g>
  <!-- 3 -->
  <g transform="translate(0,330)">
  <rect class="panel" x="10" y="340" width="430" height="310" rx="14"/>
  <circle class="n" cx="42" cy="372" r="18"/><text class="nt" x="42" y="379" text-anchor="middle">3</text>
  <text class="h" x="72" y="378">控制盒自動連上家裡的 WiFi</text>
  <use href="#ctl" x="60" y="450"/>
  <path class="arrow" d="M150 498 H270"/>
  <text class="m" x="210" y="486" text-anchor="middle">自動連線</text>
  <rect x="285" y="470" width="110" height="56" rx="8" fill="#5b6b69"/>
  <line x1="305" y1="470" x2="300" y2="440" stroke="#5b6b69" stroke-width="5" stroke-linecap="round"/>
  <line x1="375" y1="470" x2="380" y2="440" stroke="#5b6b69" stroke-width="5" stroke-linecap="round"/>
  <circle cx="310" cy="505" r="3" fill="#22c55e"/><circle cx="325" cy="505" r="3" fill="#22c55e"/>
  <text class="m" x="340" y="550" text-anchor="middle">家裡的 WiFi 分享器</text>
  <text class="m" x="40" y="600">之後每次開機都會自己連上，最多記住 5 組 WiFi。</text>
  <text class="m" x="40" y="622">IP 由分享器分配（可能會變），螢幕選單「網路」頁看得到。</text>

  </g>
  <!-- 4 -->
  <g transform="translate(-450,660)">
  <rect class="panel" x="460" y="340" width="430" height="310" rx="14"/>
  <circle class="n" cx="492" cy="372" r="18"/><text class="nt" x="492" y="379" text-anchor="middle">4</text>
  <text class="h" x="522" y="378">手機回到家裡的 WiFi，用固定網址開</text>
  <rect class="phone" x="520" y="400" width="150" height="235" rx="18"/>
  <rect class="scr" x="530" y="418" width="130" height="198" rx="6"/>
  <rect x="534" y="424" width="122" height="22" rx="11" fill="#fff" stroke="#0f766e" stroke-width="1.5"/>
  <text class="t mono" x="595" y="439" text-anchor="middle" font-size="10.5">tes-charger.local</text>
  <text class="t" x="540" y="472" font-size="12" font-weight="700">充電中</text>
  <text class="t mono" x="540" y="498" font-size="14">84.3 V</text>
  <text class="t mono" x="540" y="522" font-size="14">10.0 A</text>
  <text class="t mono" x="540" y="546" font-size="14">SOC 72%</text>
  <text class="m" x="690" y="450">固定網址：</text>
  <text class="t mono" x="690" y="472" font-size="14">tes-charger.local</text>
  <text class="m" x="690" y="512">家裡有兩台以上時：</text>
  <text class="t mono" x="690" y="534" font-size="14">tes-xxxxxx.local</text>
  <text class="m" x="690" y="574">打不開時改用</text>
  <text class="m" x="690" y="594">螢幕上顯示的 IP</text>
  </g>
</svg>
